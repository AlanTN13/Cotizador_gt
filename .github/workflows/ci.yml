name: Courier checks
on:
  pull_request:
    branches: [main, codex/globaltrip-form-n8n]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node workflow/build-workflow.mjs
      - run: git diff --exit-code -- workflow/GlobalTrip-Courier-V1.n8n.json workflow/tax-runtime.mjs workflow/tax-resolver-manifest.json
      - run: npm test
      - run: npm run build
